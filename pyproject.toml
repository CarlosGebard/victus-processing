[project]
name = "paper-processing-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling==2.80.0",
    "httpx>=0.28,<1",
    "langfuse>=3,<4",
    "litellm>=1,<2",
    "pyarrow>=22,<23",
    "torch",
    "torchvision",
    "pydantic>=2.12,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "requests==2.32.5",
    "PyYAML==6.0.3",
]

[project.scripts]
victus-processing = "src.cli:main"
victus-infisical-env = "ops.scripts.infisical_env:main"
victus-postgres-export = "ops.scripts.export_postgres_tables:main"
contracts = "ops.scripts.contracts:main"

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "ops"]
