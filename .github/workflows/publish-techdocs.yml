name: Publish TechDocs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'catalog-info.yaml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: victus-fit/victus-infra/.github/workflows/publish-techdocs.yml@main
    with:
      entity: default/Component/victus-processing
