seed_paper: "DOI:10.1056/NEJM199704173361601"

exploration:
  mode: "broad-nutrition"
  limit: 50
  min_citations: 100
  min_year: 2000
  buffer_size: 50
  max_abstract_words: 300
  seed_doi_file: "data/inputs/seeds/seed_dois.txt"
  completed_seed_doi_file: "data/inputs/seeds/explored_seed_dois.txt"

metadata_selection:
  model: "gpt-5-mini"
  abstract_preview_words: 20
  batch_size: 20

api:
  semantic_scholar_url: "https://api.semanticscholar.org/graph/v1"

rate_limit:
  base_delay: 1.0
  max_delay: 30
  retries: 5

storage:
  papers_dir: "data/runtime/01_candidates/active"
  discarded_dir: "data/runtime/01_candidates/discarded"
  registry_dir: "data/registry"
  raw_pdf_dir: "data/runtime/pdf_retrieval/raw"
  unmatched_pdf_dir: "data/runtime/pdf_retrieval/unmatched"

docling_ingestion:
  input_dir: "data/runtime/pdfs/normalized"
  output_dir: "data/runtime/docling"

heuristics:
  full_dir: "data/runtime/docling"
  final_dir: "data/runtime/docling"

llm_to_claim:
  input_dir: "data/runtime/docling"
  output_dir: "data/runtime/claims"
  model: "gpt-5-mini"
  max_claims: 20
  auto_approve_max_tokens: 7000
  temperature: 0.0

testing:
  root_dir: "data/archive/experiments/testing_1"
  docling_output_dir: "data/archive/experiments/testing_1/docling"
  claims_output_dir: "data/archive/experiments/testing_1/claims"
